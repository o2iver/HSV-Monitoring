<title>HSV Solingen-Gräfrath – Monitoring</title>
<style>
  :root{
    --blue:#0F777E; --red:#b00020; --gray:#6b7280; --bg:#f4f5f7;
    --card:#ffffff; --border:#e2e4e8; --text:#00223F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; justify-content:center;
    padding:0 0 40px 0;
  }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--card);
    box-shadow:0 0 24px rgba(0,0,0,0.06); }
  header{ padding:24px 20px 16px; border-bottom:1px solid var(--border); }
  header h1{ font-size:20px; margin:0 0 4px; }
  header .sub{ font-size:13px; color:var(--gray); margin:0; }
  .status{ display:inline-block; margin-top:10px; font-size:11.5px; font-weight:700; color:var(--red);
    background:#fdecec; padding:3px 8px; border-radius:5px; }
  main{ padding:20px; }
  a.card-link{
    display:block; text-decoration:none; color:inherit; padding:18px 18px;
    border:2px solid var(--border); border-radius:14px; margin-bottom:14px; background:#fafafa;
  }
  a.card-link:active{ transform:scale(0.98); }
  a.card-link .t{ font-size:16px; font-weight:700; margin-bottom:4px; }
  a.card-link .d{ font-size:13px; color:var(--gray); }
  .note-box{ margin-top:20px; padding:14px; border-radius:10px; background:#f0f4ff; font-size:13px; color:#333; }
</style>
