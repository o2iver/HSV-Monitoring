<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kurzer Belastungscheck</title>
<style>
  :root{
    --blue:#0F777E; --blue-dark:#0A4D52; --green:#2e7d32; --red:#b00020;
    --amber:#8a5a00; --amber-bg:#fff3e0; --gray:#6b7280; --bg:#f4f5f7;
    --card:#ffffff; --border:#e2e4e8; --text:#00223F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; justify-content:center;
    padding:0 0 40px 0;
  }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--card);
    box-shadow:0 0 24px rgba(0,0,0,0.06); display:flex; flex-direction:column; }
  header{ padding:16px 20px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card); z-index:5;}
  header h1{ font-size:19px; margin:0 0 2px; }
  header .sub{ font-size:13px; color:var(--gray); margin:0; }
  .status{ display:inline-block; margin-top:8px; font-size:11.5px; font-weight:700; color:var(--red);
    background:#fdecec; padding:3px 8px; border-radius:5px; }
  .progress-track{ height:6px; background:var(--border); border-radius:3px; margin-top:12px; overflow:hidden;}
  .progress-fill{ height:100%; background:var(--blue); border-radius:3px; transition:width .2s ease; }
  main{ flex:1; padding:20px; }
  .qhint{ font-size:13px; color:var(--gray); margin:-6px 0 14px; }
  h2.qtitle{ font-size:17px; margin:0 0 4px; line-height:1.35; }
  .req{ font-size:11px; color:var(--gray); font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;}
  .options{ display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .opt-btn{
    text-align:left; padding:14px 16px; font-size:15px; border-radius:12px;
    border:2px solid var(--border); background:#fafafa; cursor:pointer; transition:.15s;
  }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn.selected{ border-color:var(--blue); background:#E7F1F2; font-weight:600; }
  .scale-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:8px;}
  .scale-btn{ aspect-ratio:1; border-radius:10px; border:2px solid var(--border); background:#fafafa;
    font-size:16px; font-weight:700; cursor:pointer; }
  .scale-btn.selected{ border-color:var(--blue); background:var(--blue); color:#fff; }
  .scale-caption{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--gray); margin-top:8px;}
  textarea, input[type=text], input[type=date], input[type=time], input[type=number]{
    width:100%; padding:12px 14px; font-size:15px; border-radius:10px; border:2px solid var(--border);
    font-family:inherit; margin-top:6px;
  }
  textarea{ min-height:80px; resize:vertical; }
  .charcount{ font-size:11px; color:var(--gray); text-align:right; margin-top:4px;}
  .tissue-row{ margin-bottom:16px; }
  .tissue-region{ font-weight:700; font-size:14px; margin-bottom:6px; }
  .tissue-options{ flex-direction:row; flex-wrap:wrap; gap:8px; margin-top:0; }
  .tissue-btn{ flex:none; padding:10px 12px; font-size:13.5px; }
  .tissue-scale-label{ font-size:12px; color:var(--gray); margin-top:10px; }
  .tissue-scale-grid{ margin-top:6px; }
  .field-row{ margin-bottom:16px; }
  .field-row label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#333;}
  footer{ padding:14px 20px 24px; border-top:1px solid var(--border); display:flex; gap:10px; position:sticky; bottom:0; background:var(--card);}
  .btn{ flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:disabled{ background:#c9d4e8; cursor:not-allowed; }
  .btn-secondary{ background:#eee; color:#333; }
  .summary-item{ padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .summary-q{ color:var(--gray); font-size:12px; margin-bottom:2px; }
  .note-box{ margin-top:18px; padding:14px; border-radius:10px; background:#f0f4ff; font-size:13px; color:#333; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  emailjs.init({ publicKey: "u2K7dzzEvM0bp4pln" });
</script>

<script>
const state = {
  step: -1,
  meta: { datum: "", athletinId: "", ende: "" },
  answers: {}
};

const TISSUE_REGIONS = ["Kopf / Nacken","Schulter / Arm","Ellenbogen / Arm","Unterarm / Handgelenk","Rücken / Rumpf","Hüfte / Leiste","Oberschenkel","Knie","Unterschenkel","Sprunggelenk / Fuß"];
const TISSUE_TYPES = ["Gelenk","Muskel","Sehne","Unsicher"];

const questions = [
  { id:"einheit_typ", type:"multi", other:true, required:true,
    title:"Welche Einheit hast du gerade beendet?",
    hint:"Mehrfachauswahl möglich, wenn mehrere Teile direkt zusammengehören (z. B. Kraft + Halle). Bei zeitlich getrennten Einheiten bitte je einen eigenen Check absenden.",
    options:["Hallentraining / Handball allgemein","Tempotraining / hohe Geschwindigkeit","Angriffstraining","Abwehrtraining","kombiniertes Angriff-/Abwehrtraining","Krafttraining","Athletik / Schnelligkeit","Ausdauer / Lauftraining","Individuelles Handballtraining","Physio / Reha / Return-to-Sport","Spiel","Regenerationseinheit","Sonstiges"] },
  { id:"teilnahme_status", type:"single", required:true,
    title:"Konntest du die Einheit wie vorgesehen absolvieren?",
    options:["Ja, vollständig","Ja, aber reduziert oder angepasst","Nein, vorzeitig beendet","Nein, nicht teilgenommen"] },
  { id:"abweichungsgrund", type:"single", required:true,
    showIf: a => a.teilnahme_status && a.teilnahme_status !== "Ja, vollständig",
    title:"Was war der Hauptgrund?",
    options:["gesundheitliche Beschwerden","geplante Belastungssteuerung","Reha / Return-to-Sport","organisatorischer oder privater Grund","anderer Grund","möchte ich nicht angeben"] },
  { id:"dauer_minuten", type:"number", required:true,
    showIf: a => a.teilnahme_status !== "Nein, nicht teilgenommen",
    title:"Wie lange hat die gesamte Einheit gedauert?",
    hint:"In Minuten. Aufwärmen, Hauptteil und Auslaufen zusammenrechnen.", min:1, max:240 },
  { id:"session_rpe", type:"scale11", required:true,
    showIf: a => a.teilnahme_status !== "Nein, nicht teilgenommen",
    title:"Wie anstrengend war die gesamte Einheit für dich persönlich?",
    hint:"Dein eigenes Empfinden über die gesamte Einheit, nicht nur der härteste Moment.",
    lowLabel:"überhaupt nicht anstrengend", highLabel:"maximal" },
  { id:"beschwerden_nach_einheit", type:"single", required:true,
    title:"Sind während oder nach der Einheit neue Beschwerden aufgetreten oder bestehende Beschwerden schlechter geworden?",
    options:["Nein","Ja","Unsicher"] },
  { id:"beschwerderegion_nach_einheit", type:"multi", required:true,
    showIf: a => a.beschwerden_nach_einheit==="Ja" || a.beschwerden_nach_einheit==="Unsicher",
    title:"Wo liegen die Beschwerden hauptsächlich?", hint:"Mehrfachauswahl möglich.",
    options:["Kopf / Nacken","Schulter / Arm","Ellenbogen / Arm","Unterarm / Handgelenk","Rücken / Rumpf","Hüfte / Leiste","Oberschenkel","Knie","Unterschenkel","Sprunggelenk / Fuß","ganzer Körper","andere / unklar"] },
  { id:"beschwerde_gewebe_nach_einheit", type:"regiontissue", required:true, regionsField:"beschwerderegion_nach_einheit",
    showIf: a => (a.beschwerden_nach_einheit==="Ja" || a.beschwerden_nach_einheit==="Unsicher") &&
      Array.isArray(a.beschwerderegion_nach_einheit) && a.beschwerderegion_nach_einheit.some(r => TISSUE_REGIONS.includes(r)),
    title:"Ist es dort eher das Gelenk, der Muskel, die Sehne – oder unsicher?",
    hint:"Für jede angegebene Region einzeln, Mehrfachauswahl je Region möglich." },
  { id:"beschwerdestaerke_nach_einheit", type:"scale11", required:true, autoFromRegions:"beschwerde_gewebe_nach_einheit",
    showIf: a => a.beschwerden_nach_einheit==="Ja" || a.beschwerden_nach_einheit==="Unsicher",
    title:"Wie stark sind die Beschwerden jetzt?", lowLabel:"keine Beschwerden", highLabel:"stärkste vorstellbare" },
  { id:"kontaktwunsch_nach_einheit", type:"single", required:true,
    showIf: a => a.beschwerden_nach_einheit==="Ja" || a.beschwerden_nach_einheit==="Unsicher",
    title:"Möchtest du deswegen kontaktiert werden?",
    options:["Ja, möglichst zeitnah","Ja, beim nächsten regulären Termin","Nein","Unsicher"] },
  { id:"freitext_nach_einheit", type:"text", required:false, maxLen:150,
    title:"Möchtest du zur Einheit noch etwas Wichtiges ergänzen?" }
];

function fullAthletinId(){
  const raw = (state.meta.athletinId || "").trim().replace(/^ATH-?/i, "").replace(/^HSV[\s-]*/i, "");
  return "HSV " + raw;
}

function visibleQuestions(){
  return questions.filter(q => !q.showIf || q.showIf(state.answers));
}

function isAnswered(q){
  const v = state.answers[q.id];
  if(!q.required) return true;
  if(q.type==="multi") return Array.isArray(v) && v.length>0;
  if(q.type==="text") return true;
  if(q.type==="number") return v !== undefined && v !== "" && !isNaN(v);
  if(q.type==="regiontissue"){
    const regions = (state.answers[q.regionsField]||[]).filter(r=>TISSUE_REGIONS.includes(r));
    if(regions.length===0) return true;
    const gew = v || {};
    return regions.every(r => gew[r] && Array.isArray(gew[r].arten) && gew[r].arten.length>0 && gew[r].staerke !== undefined);
  }
  return v !== undefined && v !== "" && v !== null;
}

function app(){ return document.getElementById("app"); }

function renderStart(){
  app().innerHTML = `
    <header>
      <h1>Kurzer Belastungscheck</h1>
      <p class="sub">nach Training oder Spiel</p>
    </header>
    <main>
      <p style="font-size:14px;line-height:1.5;">Bitte bewerte die gerade beendete Einheit als Ganzes. Der reguläre Check dauert weniger als eine Minute. Am besten 10–30 Minuten nach Ende der Einheit ausfüllen.</p>
      <div class="field-row">
        <label>Datum</label>
        <input type="date" id="f_datum">
      </div>
      <div class="field-row">
        <label>Deine Trikotnummer</label>
        <input type="text" id="f_id" placeholder="z. B. 73" inputmode="numeric">
      </div>
      <div class="field-row">
        <label>Einheit endete um</label>
        <input type="time" id="f_ende">
      </div>
      <div class="note-box">Deine Antworten werden direkt und vertraulich an Olli übermittelt.</div>
    </main>
    <footer>
      <button class="btn btn-primary" id="startBtn" disabled>Los geht's</button>
    </footer>
  `;
  document.getElementById("f_datum").addEventListener("input", e=>{ state.meta.datum = e.target.value; checkStart(); });
  document.getElementById("f_id").addEventListener("input", e=>{ state.meta.athletinId = e.target.value; checkStart(); });
  document.getElementById("f_ende").addEventListener("input", e=>{ state.meta.ende = e.target.value; checkStart(); });
  document.getElementById("startBtn").addEventListener("click", ()=>{ state.step = 0; render(); });
}

function checkStart(){
  const ok = state.meta.datum && state.meta.athletinId && state.meta.ende;
  document.getElementById("startBtn").disabled = !ok;
}

function renderQuestion(){
  const vis = visibleQuestions();
  if(state.step >= vis.length){ state.step = "summary"; render(); return; }
  const q = vis[state.step];
  const progressPct = Math.round((state.step/vis.length)*100);

  let bodyHtml = `<h2 class="qtitle">${q.title}</h2>`;
  if(q.hint) bodyHtml += `<p class="qhint">${q.hint}</p>`;
  if(q.required) bodyHtml += `<div class="req">Pflichtfeld</div>`;

  if(q.type==="single"){
    bodyHtml += `<div class="options">` + q.options.map(o=>
      `<button class="opt-btn ${state.answers[q.id]===o?'selected':''}" data-o="${encodeURIComponent(o)}">${o}</button>`
    ).join("") + `</div>`;
  } else if(q.type==="multi"){
    const sel = state.answers[q.id] || [];
    bodyHtml += `<div class="options">` + q.options.map(o=>
      `<button class="opt-btn ${sel.includes(o)?'selected':''}" data-o="${encodeURIComponent(o)}">${o}</button>`
    ).join("") + `</div>`;
    if(q.other && sel.includes("Sonstiges")){
      bodyHtml += `<input type="text" id="otherText" placeholder="Welche andere Einheit?" maxlength="50" style="margin-top:10px;" value="${state.answers[q.id+'_sonstiges']||''}">`;
    }
  } else if(q.type==="scale11"){
    let autoHandled = false;
    if(q.autoFromRegions){
      const gew = state.answers[q.autoFromRegions] || {};
      const vals = Object.values(gew).map(e=>e.staerke).filter(v=>v!==undefined);
      if(vals.length>0){
        state.answers[q.id] = Math.max(...vals);
        bodyHtml += `<div class="note-box">Automatisch aus deinen Angaben zu den einzelnen Regionen übernommen: <strong>${state.answers[q.id]}/10</strong> (höchster angegebener Wert). Keine weitere Eingabe nötig.</div>`;
        autoHandled = true;
      }
    }
    if(!autoHandled){
      bodyHtml += `<div class="scale-grid">` + Array.from({length:11},(_,n)=>
        `<button class="scale-btn ${state.answers[q.id]===n?'selected':''}" data-n="${n}">${n}</button>`
      ).join("") + `</div>`;
      bodyHtml += `<div class="scale-caption"><span>${q.lowLabel}</span><span>${q.highLabel}</span></div>`;
    }
  } else if(q.type==="number"){
    const val = state.answers[q.id] !== undefined ? state.answers[q.id] : "";
    bodyHtml += `<input type="number" id="numInput" min="${q.min}" max="${q.max}" value="${val}" placeholder="Minuten">`;
  } else if(q.type==="text"){
    const val = state.answers[q.id] || "";
    bodyHtml += `<textarea id="freeText" maxlength="${q.maxLen}" placeholder="Optional …">${val}</textarea>`;
    bodyHtml += `<div class="charcount" id="charcount">${val.length} / ${q.maxLen}</div>`;
  } else if(q.type==="regiontissue"){
    const regions = (state.answers[q.regionsField]||[]).filter(r=>TISSUE_REGIONS.includes(r));
    const gew = state.answers[q.id] || {};
    bodyHtml += regions.map(r=>{
      const entry = gew[r] || {arten:[], staerke:undefined};
      const sel = entry.arten || [];
      const scaleBtns = Array.from({length:11},(_,n)=>
        `<button class="scale-btn tissue-scale-btn ${entry.staerke===n?'selected':''}" data-r="${encodeURIComponent(r)}" data-n="${n}">${n}</button>`
      ).join("");
      return `<div class="tissue-row">
        <div class="tissue-region">${r}</div>
        <div class="options tissue-options">${TISSUE_TYPES.map(t=>
          `<button class="opt-btn tissue-btn ${sel.includes(t)?'selected':''}" data-r="${encodeURIComponent(r)}" data-t="${encodeURIComponent(t)}">${t}</button>`
        ).join("")}</div>
        <div class="tissue-scale-label">Stärke für diese Region (0 = keine, 10 = stärkste vorstellbare)</div>
        <div class="scale-grid tissue-scale-grid">${scaleBtns}</div>
      </div>`;
    }).join("");
  }

  app().innerHTML = `
    <header>
      <h1>Kurzer Belastungscheck</h1>
      <p class="sub">Frage ${state.step+1} von ${vis.length}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </header>
    <main>${bodyHtml}</main>
    <footer>
      <button class="btn btn-secondary" id="backBtn">Zurück</button>
      <button class="btn btn-primary" id="nextBtn" ${isAnswered(q)?'':'disabled'}>Weiter</button>
    </footer>
  `;

  if(q.type==="single"){
    document.querySelectorAll(".opt-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.answers[q.id] = decodeURIComponent(btn.dataset.o);
        renderQuestion();
      });
    });
  } else if(q.type==="multi"){
    document.querySelectorAll(".opt-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const o = decodeURIComponent(btn.dataset.o);
        const arr = state.answers[q.id] || [];
        const idx = arr.indexOf(o);
        if(idx>=0) arr.splice(idx,1); else arr.push(o);
        state.answers[q.id] = arr;
        renderQuestion();
      });
    });
    const ot = document.getElementById("otherText");
    if(ot) ot.addEventListener("input", e=>{ state.answers[q.id+"_sonstiges"] = e.target.value; });
  } else if(q.type==="scale11"){
    document.querySelectorAll(".scale-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.answers[q.id] = parseInt(btn.dataset.n,10);
        renderQuestion();
      });
    });
  } else if(q.type==="number"){
    const ni = document.getElementById("numInput");
    ni.addEventListener("input", e=>{
      state.answers[q.id] = e.target.value;
      document.getElementById("nextBtn").disabled = !isAnswered(q);
    });
  } else if(q.type==="text"){
    const ta = document.getElementById("freeText");
    ta.addEventListener("input", e=>{
      state.answers[q.id] = e.target.value;
      document.getElementById("charcount").textContent = e.target.value.length + " / " + q.maxLen;
    });
  } else if(q.type==="regiontissue"){
    document.querySelectorAll(".tissue-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const r = decodeURIComponent(btn.dataset.r);
        const t = decodeURIComponent(btn.dataset.t);
        const gew = state.answers[q.id] || (state.answers[q.id] = {});
        const entry = gew[r] || (gew[r] = {arten:[], staerke:undefined});
        const idx = entry.arten.indexOf(t);
        if(idx>=0) entry.arten.splice(idx,1); else entry.arten.push(t);
        renderQuestion();
      });
    });
    document.querySelectorAll(".tissue-scale-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const r = decodeURIComponent(btn.dataset.r);
        const n = parseInt(btn.dataset.n,10);
        const gew = state.answers[q.id] || (state.answers[q.id] = {});
        const entry = gew[r] || (gew[r] = {arten:[], staerke:undefined});
        entry.staerke = n;
        renderQuestion();
      });
    });
  }

  document.getElementById("backBtn").addEventListener("click", ()=>{
    if(state.step===0){ state.step=-1; render(); } else { state.step--; render(); }
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    if(!isAnswered(q)) return;
    if(q.id==="teilnahme_status" && q.options && state.answers[q.id]==="Nein, nicht teilgenommen"){
      state.answers.dauer_minuten = 0;
      state.answers.session_rpe = 0;
    }
    state.step++;
    render();
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildMachineRecord(){
  const rawId = (state.meta.athletinId || "").trim();
  const isTest = /test/i.test(rawId);
  const sessionEnde = (state.meta.datum && state.meta.ende) ? (state.meta.datum + "T" + state.meta.ende + ":00") : "";
  const rec = {
    datenart: isTest ? "technischer_test" : "echtdaten",
    record_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("rid_" + Date.now() + "_" + Math.random().toString(36).slice(2)),
    athletin_id: fullAthletinId(),
    session_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("sid_" + Date.now() + "_" + Math.random().toString(36).slice(2)),
    session_ende: sessionEnde,
    erfasst_am: new Date().toISOString(),
    fragebogen_version: "POST-SESSION-0.4",
    datenquelle_vorbelegung: "keine",
    pruefstatus: "neu"
  };
  questions.forEach(q=>{
    if(state.answers[q.id] !== undefined) rec[q.id] = state.answers[q.id];
  });
  return rec;
}

function buildPlainText(){
  const vis = visibleQuestions();
  const lines = [];
  lines.push("Belastungscheck nach Training/Spiel");
  lines.push("Datum: " + state.meta.datum);
  lines.push("Athletinnen-ID: " + fullAthletinId());
  lines.push("Einheit endete um: " + state.meta.ende + " Uhr");
  lines.push("");
  vis.forEach(q=>{
    if(q.type==="regiontissue"){
      const regions = (state.answers[q.regionsField]||[]).filter(r=>TISSUE_REGIONS.includes(r));
      const gew = state.answers[q.id] || {};
      lines.push("Region, Gewebeart und Stärke der Beschwerden:");
      regions.forEach(r=>{
        const entry = gew[r] || {};
        const arten = (entry.arten||[]).join(", ") || "keine Angabe";
        const staerke = entry.staerke !== undefined ? entry.staerke + "/10" : "keine Angabe";
        lines.push("- " + r + ": " + arten + " (Stärke: " + staerke + ")");
      });
      return;
    }
    let v = state.answers[q.id];
    if(Array.isArray(v)) v = v.join(", ") + (state.answers[q.id+"_sonstiges"] ? " (" + state.answers[q.id+"_sonstiges"] + ")" : "");
    if(v===undefined || v==="") v = "keine Angabe";
    lines.push(q.title + ": " + v);
  });
  lines.push("");
  lines.push("--- Maschinenlesbar (JSON, für automatische Auswertung, bitte nicht von Hand bearbeiten) ---");
  lines.push(JSON.stringify(buildMachineRecord()));
  return lines.join("\n");
}

function renderSummary(){
  const vis = visibleQuestions();
  let rows = `
    <div class="summary-item"><div class="summary-q">Datum / ID / Ende</div>${state.meta.datum} · ${fullAthletinId()} · ${state.meta.ende} Uhr</div>
  `;
  vis.forEach(q=>{
    if(q.type==="regiontissue"){
      const regions = (state.answers[q.regionsField]||[]).filter(r=>TISSUE_REGIONS.includes(r));
      const gew = state.answers[q.id] || {};
      const detail = regions.map(r=>{
        const entry = gew[r] || {};
        const arten = (entry.arten||[]).join(", ") || "keine Angabe";
        const staerke = entry.staerke !== undefined ? entry.staerke + "/10" : "keine Angabe";
        return `${r}: ${arten} (Stärke ${staerke})`;
      }).join("<br>") || "– keine Angabe –";
      rows += `<div class="summary-item"><div class="summary-q">Region, Gewebeart und Stärke</div>${detail}</div>`;
      return;
    }
    let v = state.answers[q.id];
    if(Array.isArray(v)) v = v.join(", ") + (state.answers[q.id+"_sonstiges"] ? " (" + state.answers[q.id+"_sonstiges"] + ")" : "");
    if(v===undefined || v==="") v = "– keine Angabe –";
    rows += `<div class="summary-item"><div class="summary-q">${q.title}</div>${v}</div>`;
  });
  const plainText = buildPlainText();
  app().innerHTML = `
    <header>
      <h1>Zusammenfassung</h1>
      <p class="sub">Bitte kurz prüfen</p>
    </header>
    <main>
      ${rows}
      <div class="note-box">Das ist eine Testversion. Diese Antworten wurden noch nirgends automatisch gespeichert oder verschickt.</div>
      <div class="field-row" style="margin-top:16px;">
        <label>Antworten als Text (zum Kopieren oder Senden)</label>
        <textarea id="exportText" readonly style="min-height:180px;">${escapeHtml(plainText)}</textarea>
      </div>
      <button class="btn btn-primary" id="autoSendBtn" type="button" style="width:100%;margin-top:4px;">Jetzt automatisch senden</button>
      <p id="sendStatus" style="font-size:13px;font-weight:600;margin-top:8px;min-height:18px;"></p>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-secondary" id="copyBtn" type="button">Text kopieren</button>
        <button class="btn btn-secondary" id="mailBtn" type="button">Manuell per Mail senden</button>
      </div>
      <p id="copyStatus" style="font-size:12px;color:var(--gray);margin-top:8px;"></p>
    </main>
    <footer>
      <button class="btn btn-secondary" id="restartBtn">Neu beginnen</button>
    </footer>
  `;
  document.getElementById("restartBtn").addEventListener("click", ()=>{
    state.step=-1; state.meta={datum:"",athletinId:"",ende:""}; state.answers={}; render();
  });
  document.getElementById("copyBtn").addEventListener("click", async ()=>{
    const ta = document.getElementById("exportText");
    ta.focus(); ta.select(); ta.setSelectionRange(0, 999999);
    let ok = false;
    try{ await navigator.clipboard.writeText(ta.value); ok = true; }
    catch(e){ try{ ok = document.execCommand("copy"); }catch(e2){ ok = false; } }
    document.getElementById("copyStatus").textContent = ok
      ? "Kopiert! Du kannst den Text jetzt z. B. in eine Notiz, WhatsApp oder OneDrive einfügen."
      : "Kopieren hat nicht automatisch geklappt – bitte den Text oben von Hand markieren und kopieren.";
  });
  document.getElementById("autoSendBtn").addEventListener("click", ()=>{
    const btn = document.getElementById("autoSendBtn");
    const statusEl = document.getElementById("sendStatus");
    const subject = "Belastungscheck – " + fullAthletinId();
    const message = plainText;
    btn.disabled = true;
    btn.textContent = "Wird gesendet …";
    statusEl.style.color = "var(--gray)";
    statusEl.textContent = "";
    emailjs.send("service_cx4ksx5", "template_xn5hexf", { subject: subject, message: message })
      .then(()=>{
        statusEl.style.color = "var(--green)";
        statusEl.textContent = "✓ Gesendet! Der Check ist angekommen.";
        btn.textContent = "Erneut senden";
        btn.disabled = false;
      })
      .catch(()=>{
        statusEl.style.color = "var(--red)";
        statusEl.textContent = "Senden hat nicht geklappt (z. B. kein Internet). Bitte Text kopieren oder manuell per Mail senden.";
        btn.textContent = "Jetzt automatisch senden";
        btn.disabled = false;
      });
  });
  document.getElementById("mailBtn").addEventListener("click", ()=>{
    const subject = encodeURIComponent("Belastungscheck – " + fullAthletinId());
    const body = encodeURIComponent(plainText);
    window.location.href = "mailto:og.hsvlegenden@gmail.com?subject=" + subject + "&body=" + body;
  });
}

function render(){
  if(state.step === -1) renderStart();
  else if(state.step === "summary") renderSummary();
  else renderQuestion();
}

render();
</script>
</body>
</html>
